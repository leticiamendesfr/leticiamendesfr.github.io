<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">Hostel Reels Lab — estrutura de um roteiro A/B</title><desc id="desc">Representação didática do schema documentado. Sem geração nova ou dados de marca.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="m0 0 6 3-6 3" fill="none" stroke="#718397"/></marker></defs><rect width="900" height="470" rx="6" fill="#1c2026"/><text x="30" y="38" fill="#e9eff8" font-family="Arial,sans-serif" font-size="18">Hostel Reels Lab — estrutura de um roteiro A/B</text><text x="30" y="62" fill="#91a0b2" font-family="Arial,sans-serif" font-size="11">Representação didática do schema documentado. Sem geração nova ou dados de marca.</text><rect x="30" y="100" width="400" height="245" rx="5" fill="#293b4f" stroke="#708eaf"/><text x="47" y="127" fill="#e5edf7" font-family="Arial,sans-serif" font-size="14">Versão A</text><text x="47" y="149" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Gancho: proposta de abertura</text><text x="47" y="167" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Cenas: sequência e materiais</text><text x="47" y="185" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Texto na tela + legenda + CTA</text><text x="47" y="203" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Hipótese e variável do teste</text><text x="47" y="221" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Métrica e janela de observação</text><text x="47" y="239" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Fatos a confirmar antes de publicar</text><rect x="470" y="100" width="400" height="245" rx="5" fill="#293b4f" stroke="#708eaf"/><text x="487" y="127" fill="#e5edf7" font-family="Arial,sans-serif" font-size="14">Versão B</text><text x="487" y="149" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Gancho: alternativa da abertura</text><text x="487" y="167" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Corpo e demais condições mantidos</text><text x="487" y="185" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Uma variável controlada por teste</text><text x="487" y="203" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Critério de sucesso explícito</text><text x="487" y="221" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Revisão editorial humana</text><text x="487" y="239" fill="#a3b0c0" font-family="Arial,sans-serif" font-size="11">Sem promessa de viralização</text><text x="30" y="393" fill="#a4bbce" font-family="Arial,sans-serif" font-size="12">Preparar A/B não comprova execução, significância ou resultado do experimento.</text><text x="30" y="443" fill="#8797aa" font-family="Arial,sans-serif" font-size="10">Letícia Mendes / documentação do projeto</text></svg>